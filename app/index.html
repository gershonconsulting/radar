<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radar — Warm intros to your ideal customers</title>
<meta name="description" content="Radar maps the people who can introduce you to your ideal customers. Watch the right organizations, find the bridges inside them, and collect graded prospects — automatically, through a Chrome extension." />
<meta property="og:title" content="Radar — Warm intros to your ideal customers" />
<meta property="og:description" content="Source → Bridge → Prospect. Radar turns the organizations you watch into a steady stream of graded, ready-to-contact prospects." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://radar.gershoncrm.com" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#0b1020; --bg2:#0e1530; --ink:#0b1020; --paper:#ffffff;
    --muted:#5b6478; --line:#e6e9f2; --soft:#f5f7fc;
    --brand:#CC3333; --brand2:#a8281f; --brand-ink:#a8281f;
    --grad:linear-gradient(120deg,#CC3333 0%,#a8281f 100%);
    --ok:#16a34a; --shadow:0 18px 50px rgba(18,28,64,.14);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:#1a2133;background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  .btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.98rem;padding:.8rem 1.25rem;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.18s;white-space:nowrap}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(204,51,51,.35)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(204,51,51,.45)}
  .btn-ghost{background:#fff;border-color:var(--line);color:#1a2133}
  .btn-ghost:hover{border-color:#c8cfe6;background:var(--soft)}
  .btn-lite{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
  .btn-lite:hover{background:rgba(255,255,255,.16)}
  .li{width:16px;height:16px;flex:none}

  header{position:sticky;top:0;z-index:40;backdrop-filter:saturate(180%) blur(12px);background:rgba(255,255,255,.82);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(204,51,51,.4)}
  .brand small{display:block;font-weight:600;font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:-2px}
  .nav-links{display:flex;align-items:center;gap:1.4rem}
  .nav-links a.link{color:#3a4258;font-weight:500;font-size:.95rem}
  .nav-links a.link:hover{color:var(--brand-ink)}
  @media(max-width:720px){.nav-links a.link{display:none}}

  .hero{position:relative;overflow:hidden;background:radial-gradient(1200px 600px at 78% -10%,#1b2a63 0,transparent 55%),radial-gradient(900px 500px at 10% 0,#12224d 0,transparent 55%),linear-gradient(180deg,#0b1020,#0e1734);color:#eaf0ff}
  .hero .wrap{padding:76px 24px 90px;position:relative;z-index:2}
  .kicker{display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:600;letter-spacing:.02em;color:#bcd0ff;background:rgba(120,150,255,.12);border:1px solid rgba(140,165,255,.28);padding:.4rem .8rem;border-radius:999px}
  .hero h1{font-size:clamp(2.1rem,5vw,3.5rem);line-height:1.05;letter-spacing:-.03em;margin:1.1rem 0 0;font-weight:800;color:#fff}
  .hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.sub{font-size:1.14rem;color:#c3ccea;max-width:640px;margin:1.1rem 0 0}
  .cta-row{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
  .trust{margin-top:1.4rem;font-size:.86rem;color:#93a0c9}
  .rings{position:absolute;right:-160px;top:-120px;width:620px;height:620px;opacity:.5;z-index:1;pointer-events:none}
  .rings span{position:absolute;inset:0;margin:auto;border:1px solid rgba(120,160,255,.28);border-radius:50%}
  .rings span:nth-child(1){width:620px;height:620px}
  .rings span:nth-child(2){width:460px;height:460px}
  .rings span:nth-child(3){width:300px;height:300px}
  .rings span:nth-child(4){width:150px;height:150px}
  .sweep{position:absolute;inset:0;margin:auto;width:620px;height:620px;border-radius:50%;background:conic-gradient(from 0deg,rgba(34,211,238,.28),transparent 30%);animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .mock{margin-top:3.2rem;position:relative;z-index:2;background:#0c1430;border:1px solid rgba(120,150,255,.22);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
  .mock .bar{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid rgba(120,150,255,.16);background:#0a1128}
  .mock .bar i{width:11px;height:11px;border-radius:50%;background:#334166;display:inline-block}
  .mock .bar .u{margin-left:.6rem;font-size:.8rem;color:#8ea0d0}
  .flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:0;align-items:stretch;padding:26px 22px}
  @media(max-width:760px){.flow{grid-template-columns:1fr;gap:14px}.flow .arrow{display:none}}
  .stage{background:#0f1a3d;border:1px solid rgba(120,150,255,.18);border-radius:14px;padding:16px 16px 18px}
  .stage h4{margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#7f8fc4}
  .stage .big{font-size:1.9rem;font-weight:800;color:#fff;margin:.25rem 0 .1rem}
  .stage .lbl{font-size:.86rem;color:#aeb9de}
  .stage ul{margin:.7rem 0 0;padding:0;list-style:none;font-size:.82rem;color:#c7d0ee}
  .stage ul li{display:flex;align-items:center;gap:.45rem;padding:.16rem 0}
  .stage ul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand2)}
  .arrow{display:grid;place-items:center;color:#5f6ea3;font-size:1.4rem;padding:0 6px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:-40px;position:relative;z-index:5;box-shadow:var(--shadow)}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:#fff;padding:22px 18px;text-align:center}
  .stat b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.02em;color:var(--brand-ink)}
  .stat span{font-size:.82rem;color:var(--muted)}

  section.pad{padding:76px 0}
  .eyebrow{text-align:center;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
  h2.sec{text-align:center;font-size:clamp(1.6rem,3.4vw,2.35rem);line-height:1.12;letter-spacing:-.02em;margin:.6rem auto 0;max-width:720px;font-weight:800}
  p.lead{text-align:center;color:var(--muted);max-width:640px;margin:1rem auto 0;font-size:1.05rem}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
  @media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.grid3{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:.18s}
  .card:hover{border-color:#c9d2ee;box-shadow:var(--shadow);transform:translateY(-2px)}
  .card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(135deg,#fdf2f2,#fbe4e4);border:1px solid #f3d0d0}
  .card h3{margin:.9rem 0 .35rem;font-size:1.08rem;letter-spacing:-.01em}
  .card p{margin:0;color:var(--muted);font-size:.94rem}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
  @media(max-width:820px){.steps{grid-template-columns:1fr}}
  .step{position:relative;padding:26px 22px;background:var(--soft);border:1px solid var(--line);border-radius:var(--radius)}
  .step .n{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff;font-weight:800;display:grid;place-items:center;box-shadow:0 8px 18px rgba(204,51,51,.35)}
  .step h3{margin:.8rem 0 .3rem;font-size:1.08rem}
  .step p{margin:0;color:var(--muted);font-size:.94rem}

  .extbox{display:grid;grid-template-columns:1.05fr .95fr;gap:0;margin-top:44px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  @media(max-width:820px){.extbox{grid-template-columns:1fr}}
  .extbox-main{padding:30px 32px}
  .extbox-head{display:flex;align-items:center;gap:14px}
  .extbox-ic{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--brand-ink);background:linear-gradient(135deg,#fdf2f2,#fbe4e4);border:1px solid #f3d0d0}
  .extbox-head h3{margin:0;font-size:1.12rem;letter-spacing:-.01em}
  .extbox-meta{font-size:.85rem;color:var(--muted);margin-top:2px}
  .extbox-dl{margin-top:22px}
  .extbox-note{margin:.9rem 0 0;font-size:.88rem;color:var(--muted)}
  .extbox-note a{color:var(--brand);font-weight:600}
  .extbox-steps{padding:30px 32px;background:var(--soft);border-left:1px solid var(--line)}
  @media(max-width:820px){.extbox-steps{border-left:none;border-top:1px solid var(--line)}}
  .extbox-steptitle{font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
  .extbox-steps ol{margin:.9rem 0 0;padding-left:20px;color:#33405e;font-size:.94rem;line-height:1.85}
  .extbox-steps code{background:#e8ecf9;border-radius:5px;padding:1px 6px;font-size:.86em}
  .extbox-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
  .band{background:linear-gradient(180deg,#f7f9ff,#eef2ff);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .why{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
  @media(max-width:820px){.why{grid-template-columns:1fr}}
  .why h2{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.02em;margin:0 0 .8rem;font-weight:800}
  .why p{color:#44506e;margin:.6rem 0}
  .checklist{list-style:none;margin:1.2rem 0 0;padding:0}
  .checklist li{display:flex;gap:.7rem;align-items:flex-start;padding:.45rem 0;font-size:.98rem}
  .checklist li svg{flex:none;margin-top:2px}
  .pricecard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px}
  .pricecard .tag{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
  .pricecard .amt{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin:.3rem 0}
  .pricecard .amt small{font-size:.95rem;font-weight:600;color:var(--muted)}
  .pricecard ul{list-style:none;margin:1rem 0;padding:0}
  .pricecard ul li{display:flex;gap:.55rem;align-items:center;padding:.34rem 0;font-size:.95rem;color:#33405e}
  .pricecard ul li::before{content:"✓";color:var(--ok);font-weight:800}

  .final{background:radial-gradient(900px 420px at 50% -20%,#22345f 0,transparent 60%),linear-gradient(180deg,#0b1020,#0e1734);color:#fff;text-align:center}
  .final .wrap{padding:80px 24px}
  .final h2{font-size:clamp(1.7rem,3.6vw,2.6rem);letter-spacing:-.02em;margin:0;font-weight:800}
  .final p{color:#bcc7ea;max-width:560px;margin:1rem auto 0}
  .final .cta-row{justify-content:center}

  footer{background:#0a0e1c;color:#93a0c9;font-size:.9rem}
  footer .wrap{padding:44px 24px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
  footer .brand{color:#fff}
  footer .brand small{color:#7482ab}
  footer a.link:hover{color:#fff}
  .foot-links{display:flex;gap:1.4rem;flex-wrap:wrap}
  .copy{width:100%;border-top:1px solid rgba(255,255,255,.08);padding-top:18px;color:#6d7aa4;font-size:.82rem}
</style>
</head>
<body>

    <a class="brand" href="/">

    </nav>
  </div>
</header>
